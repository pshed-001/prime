[databases]
prime_db = host=${PGBOUNCER_DB_HOST} port=${PGBOUNCER_DB_PORT} dbname=${PGBOUNCER_DATABASE}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
# Postgres 16 auths every role with SCRAM-SHA-256 (pgbouncer client+server
# legs); userlist.txt is regenerated from environment variables at startup.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
server_lifetime = 3600
server_idle_timeout = 600
query_wait_timeout = 10
log_connections = 0
log_disconnections = 0
application_name_add_host = 0

# Pooling targets - entries are auto-authenticated against userlist.txt,
# which is regenerated from environment variables on startup.
[users]
prime_user =
prime_app =