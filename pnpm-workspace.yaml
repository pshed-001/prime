packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 build-script allow-list. Packages whose native/install scripts may
# run. Keep this list minimal.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - argon2
  - esbuild
  - prisma
  - "@prisma/client"
  - "@prisma/engines"